<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Menú - Rincón Incas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: "Georgia", serif;
      background-color: #f5f0e8;
      color: #3b2b1f;
      margin: 0;
      padding: 20px;
    }
    header {
      background-color: #7b5b3b;
      color: #fdf7ee;
      padding: 20px;
      text-align: center;
    }
    h2 {
      margin-top: 20px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    ul li {
      margin: 5px 0;
    }
    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 0.9rem;
      color: #5f452f;
    }
  </style>
</head>
<body>
  <header>
    <h1>Menú de Rincón Incas</h1>
  </header>

  <main>
    <section>
      <h2>Cafés</h2>
      <ul>
        <li>Espresso</li>
        <li>Cortado</li>
        <li>Café con leche</li>
        <li>Capuchino</li>
      </ul>
    </section>

    <section>
      <h2>Medialunas</h2>
      <p>Frescas y mantecosas, recién horneadas.</p>
    </section>

    <section>
      <h2>Tostados</h2>
      <ul>
        <li>Jamón y queso</li>
        <li>Queso solo</li>
        <li>Mixtos</li>
      </ul>
    </section>

    <section>
      <h2>Picadas</h2>
      <p>Quesos, fiambres y pan casero.</p>
    </section>
  </main>

  <footer>
    © 2026 Rincón Incas
  </footer>
</body>
</html>
